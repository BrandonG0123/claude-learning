<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tennis — 10s motion graphics</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 900; src: url("../fonts/BarlowCondensed-Black.ttf"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("../fonts/BarlowCondensed-SemiBold.ttf"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 500; src: url("../fonts/BarlowCondensed-Medium.ttf"); }
  @font-face { font-family: "Barlow"; font-weight: 500; src: url("../fonts/Barlow-Medium.ttf"); }
  @font-face { font-family: "Barlow"; font-weight: 700; src: url("../fonts/Barlow-Bold.ttf"); }
  @font-face { font-family: "Bebas Neue"; font-weight: 400; src: url("../fonts/BebasNeue-Regular.ttf"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("../fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "Oswald"; font-weight: 200 700; src: url("../fonts/Oswald-Variable.ttf"); }
  @font-face { font-family: "Space Mono"; font-weight: 400; src: url("../fonts/SpaceMono-Regular.ttf"); }
  @font-face { font-family: "Space Mono"; font-weight: 700; src: url("../fonts/SpaceMono-Bold.ttf"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; bottom: 12px; color: #9fb; font: 13px/1.4 monospace; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 6px; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="ui">
  <input id="scrub" type="range" min="0" max="599" value="0" style="width:420px"> <span id="info"></span><br>
  <label><input id="play" type="checkbox"> play</label> &nbsp; keys: space play/pause, ←/→ step, shift+←/→ 10 frames
</div>
<script src="lib/core.js"></script>
<script src="lib/fx.js"></script>
<script src="lib/court.js"></script>
<script src="lib/ball.js"></script>
<script src="lib/particles.js"></script>
<script src="lib/text.js"></script>
<script src="lib/transitions.js"></script>
<script src="brand.js"></script>
<script src="scenes/scene1.js"></script>
<script src="scenes/scene2.js"></script>
<script src="scenes/scene3.js"></script>
<script src="scenes/scene4.js"></script>
<script src="scenes/scene5.js"></script>
<script src="timeline.js"></script>
<script>
(function () {
  const TN = window.TN; const canvas = document.getElementById('stage'); const ctx = canvas.getContext('2d', { alpha: false });
  const FONT_LOADS = ['900 100px "Barlow Condensed"', '600 100px "Barlow Condensed"', '500 100px "Barlow Condensed"', '700 100px "Barlow"', '500 100px "Barlow"', '400 100px "Bebas Neue"', '400 100px "Anton"', '700 100px "Oswald"', '400 100px "Space Mono"', '700 100px "Space Mono"'];
  // every face must really be loaded before frame 0: a missing font throws → pageerror → the render fails loudly instead of silently falling back
  window.__ready = Promise.all(FONT_LOADS.map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { const missing = FONT_LOADS.filter(f => !document.fonts.check(f)); if (missing.length) throw new Error('fonts not loaded: ' + missing.join(', ')); window.__fontsLoaded = true; return true; });
  // render a frame at time t (seconds). shutter = motion-blur sub-samples (1 = none). Deterministic.
  window.__render = function (t, shutter = 1, shutterAngle = 0.5) {
    if (shutter <= 1) { TN.renderFrame(ctx, t); return; }
    const acc = TN.scratch('_accum'); const g = acc.getContext('2d'); const sub = TN.scratch('_sub'); const sg = sub.getContext('2d', { alpha: false });
    const dt = (1 / TN.FPS) * shutterAngle; g.fillStyle = '#000'; g.fillRect(0, 0, TN.W, TN.H);
    for (let i = 0; i < shutter; i++) { const tt = t + (i / shutter - 0.5) * dt; TN.renderFrame(sg, Math.max(0, tt)); g.globalAlpha = 1 / (i + 1); g.drawImage(sub, 0, 0); }
    g.globalAlpha = 1; ctx.drawImage(acc, 0, 0);
  };
  // render a single scene at its LOCAL time (bypasses the timeline; applies the global post stack). for scene development.
  window.__renderScene = function (name, t, shutter = 1) {
    const saved = TN.TIMELINE; TN.TIMELINE = { scenes: [{ name, start: 0, end: 1e9 }], transitions: [], post: saved.post, postAt: null };
    try { window.__render(t, shutter); } finally { TN.TIMELINE = saved; }
  };
  // ---- interactive preview UI ----
  const scrub = document.getElementById('scrub'), info = document.getElementById('info'), play = document.getElementById('play'); let frame = 0, last = 0;
  function show(f) { frame = ((f % 600) + 600) % 600; scrub.value = frame; const t = frame / TN.FPS; const t0 = performance.now(); window.__render(t, 1); info.textContent = `frame ${frame} t=${t.toFixed(3)}s render ${(performance.now() - t0).toFixed(1)}ms`; }
  scrub.addEventListener('input', () => show(+scrub.value));
  window.addEventListener('keydown', e => { if (e.code === 'Space') { play.checked = !play.checked; e.preventDefault(); } if (e.code === 'ArrowRight') show(frame + (e.shiftKey ? 10 : 1)); if (e.code === 'ArrowLeft') show(frame - (e.shiftKey ? 10 : 1)); });
  function loop(now) { if (play.checked && now - last > 1000 / 60) { last = now; show(frame + 1); } requestAnimationFrame(loop); }
  if (!/render=1/.test(location.search)) { window.__ready.then(() => { show(0); requestAnimationFrame(loop); }); } else document.body.classList.add('render');
})();
</script>
</body>
</html>

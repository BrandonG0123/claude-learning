<title>E · Emblems</title>
<link rel="stylesheet" href="frame.css" />
<style>
  svg .centre { stroke: var(--ice); stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 18 5 3 5; fill: none; }
  svg .lead { stroke: var(--frost); stroke-opacity: 0.7; stroke-width: 1; fill: none; }
  svg .dot { fill: none; stroke: var(--frost); stroke-width: 1.2; }
  [data-lab] { position: absolute; width: 330px; text-align: right; }
  [data-lab] b { display: block; font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; text-transform: none; color: var(--frost); margin-bottom: 6px; }
  .cap { position: absolute; left: 40px; bottom: 40px; }
  .ctl { position: absolute; right: 40px; bottom: 34px; display: flex; gap: 8px; }
  .rail { position: absolute; left: 40px; top: 36px; color: var(--mist); }
  @media (max-width: 600px) { .cap { left: 24px; bottom: 96px; } .ctl { left: 24px; right: auto; bottom: 28px; } .rail { left: 24px; top: 24px; } }
</style>
